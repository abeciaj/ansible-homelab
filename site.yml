---
# Bootstraps a 3-node k3s cluster on Debian 13. See README.md for usage.

- name: Preflight checks
  hosts: k3s_cluster
  gather_facts: false
  tags: [always]
  tasks:
    - name: Check inventory.ini placeholders are filled in
      ansible.builtin.assert:
        that:
          - ansible_user != 'YOUR_SSH_USER'
          - lan_subnet is defined
        fail_msg: Set ansible_user and lan_subnet in inventory.ini first.
        quiet: true

    # ufw limits SSH to this range, so make sure the machine running Ansible
    # is inside it, or the run would lock itself out.
    - name: Check this machine is inside the SSH allow range
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress, os, sys
            client = os.environ.get("SSH_CLIENT", "").split()
            if not client:
                sys.exit("SSH_CLIENT not set")
            print(client[0])
            sys.exit(ipaddress.ip_address(client[0]) not in ipaddress.ip_network(sys.argv[1], strict=False))
          - "{{ ssh_allowed_cidr | default(lan_subnet) }}"
      register: ssh_source
      changed_when: false
      failed_when: false

    - name: Fail if SSH would be blocked for this machine
      ansible.builtin.assert:
        that: ssh_source.rc == 0
        fail_msg: >-
          This machine connects from {{ ssh_source.stdout | default('an unknown address', true) }},
          which is outside {{ ssh_allowed_cidr | default(lan_subnet) }}. The firewall would
          lock you out. Fix lan_subnet, or set ssh_allowed_cidr in inventory.ini.
        quiet: true

# One node at a time, so OS updates never take down more than one node.
- name: Base system setup
  hosts: k3s_cluster
  become: true
  serial: 1
  tags: [base]
  vars:
    k3s_server_host: "{{ groups['k3s_server'][0] }}"
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Check for pending upgrades
      ansible.builtin.apt:
        upgrade: dist
      check_mode: true
      register: apt_pending

    - name: Check whether this node is already in the cluster
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    # Not a handler: the whole sequence must finish on this node before
    # serial moves on to the next one.
    - name: Upgrade packages, draining the node if it's in the cluster  # noqa: no-handler
      when: apt_pending is changed
      block:
        - name: Drain node
          ansible.builtin.command: >
            k3s kubectl drain {{ inventory_hostname }}
            --ignore-daemonsets --delete-emptydir-data --timeout=300s
          delegate_to: "{{ k3s_server_host }}"
          when: k3s_bin.stat.exists
          changed_when: true

        - name: Upgrade all packages
          ansible.builtin.apt:
            upgrade: dist

        - name: Check if a reboot is required
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: reboot_required

        - name: Reboot
          ansible.builtin.reboot:
            reboot_timeout: 600
          when: reboot_required.stat.exists

        - name: Wait for node to be Ready
          ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} --no-headers
          register: node_after_upgrade
          until: "' Ready' in node_after_upgrade.stdout"
          retries: 30
          delay: 10
          changed_when: false
          delegate_to: "{{ k3s_server_host }}"
          when: k3s_bin.stat.exists

        - name: Uncordon node
          ansible.builtin.command: k3s kubectl uncordon {{ inventory_hostname }}
          delegate_to: "{{ k3s_server_host }}"
          when: k3s_bin.stat.exists
          changed_when: true

    - name: Install packages
      ansible.builtin.apt:
        name:
          - curl
          - git
          - htop
          - vim
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present

    # node-exporter (k8s-homelab's monitoring stack) reads metrics files from here,
    # and reports a scrape error if it's missing. The audit play writes into it.
    - name: Create the node-exporter textfile directory
      ansible.builtin.file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        owner: root
        group: root
        mode: "0755"

    # k3s registers nodes by hostname, so each must be unique.
    - name: Set hostname from the inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Disable swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Comment out swap in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        line: '#\1'
        backrefs: true

    - name: Write /etc/hosts
      ansible.builtin.template:
        src: templates/hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"

- name: Security hardening
  hosts: k3s_cluster
  become: true
  tags: [security]
  tasks:
    # Debian's defaults only install from the security archive and never reboot.
    - name: Enable unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    # sshd keeps the first value it reads, so the 10- prefix wins over other drop-ins.
    - name: Harden sshd
      ansible.builtin.template:
        src: templates/sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    # Before the k3s plays: protect-kernel-defaults makes the kubelet refuse to
    # start if these aren't already in effect.
    - name: Write kernel hardening settings
      ansible.builtin.template:
        src: templates/sysctl_hardening.conf.j2
        dest: /etc/sysctl.d/90-hardening.conf
        owner: root
        group: root
        mode: "0644"
      register: sysctl_conf

    - name: Apply kernel settings now  # noqa: no-handler
      ansible.builtin.command: sysctl --system
      when: sysctl_conf is changed
      changed_when: true

    - name: Block unused network protocols and USB/FireWire storage
      ansible.builtin.template:
        src: templates/modprobe_hardening.conf.j2
        dest: /etc/modprobe.d/90-hardening.conf
        owner: root
        group: root
        mode: "0644"

    # Gives each login session its own temp directory (Lynis DEB-0280).
    - name: Install libpam-tmpdir
      ansible.builtin.apt:
        name: libpam-tmpdir
        state: present

    # Only root needs to read these (Lynis FILE-7524).
    - name: Restrict cron and sshd config permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/crontab, mode: "0600" }
        - { path: /etc/ssh/sshd_config, mode: "0600" }
        - { path: /etc/cron.d, mode: "0700" }
        - { path: /etc/cron.daily, mode: "0700" }
        - { path: /etc/cron.hourly, mode: "0700" }
        - { path: /etc/cron.weekly, mode: "0700" }
        - { path: /etc/cron.monthly, mode: "0700" }

    - name: Configure fail2ban
      ansible.builtin.template:
        src: templates/jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Allow SSH from the LAN
      community.general.ufw:
        rule: allow
        name: OpenSSH
        src: "{{ ssh_allowed_cidr | default(lan_subnet) }}"

    - name: Allow k3s node-to-node traffic from the LAN
      community.general.ufw:
        rule: allow
        src: "{{ lan_subnet }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "6443", proto: tcp }    # Kubernetes API
        - { port: "8472", proto: udp }    # Flannel VXLAN
        - { port: "10250", proto: tcp }   # Kubelet

    # ServiceLB DNATs 80/443 to the Traefik pod, so allow both the INPUT
    # and the routed (FORWARD) path.
    - name: Allow HTTP/HTTPS to Traefik from the LAN
      community.general.ufw:
        rule: allow
        src: "{{ lan_subnet }}"
        port: "{{ item.port }}"
        proto: tcp
        route: "{{ item.route }}"
      loop:
        - { port: "80", route: false }
        - { port: "443", route: false }
        - { port: "80", route: true }
        - { port: "443", route: true }

    - name: Allow k3s pod and service networks
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
      loop:
        - "{{ k3s_pod_cidr }}"
        - "{{ k3s_service_cidr }}"

    # Flannel masquerades pod-to-node traffic, so Prometheus scrapes of node-exporter
    # arrive from a node's LAN IP, not the pod network. Nodes only, not the whole LAN.
    - name: Allow node-exporter scrapes from the cluster nodes
      community.general.ufw:
        rule: allow
        src: "{{ hostvars[item].ansible_host }}"
        port: "9100"
        proto: tcp
      loop: "{{ groups['k3s_cluster'] }}"

    - name: Enable ufw with default deny
      community.general.ufw:
        state: enabled
        policy: deny

  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

# Not drained on upgrade: with a single control-plane there's nowhere to move
# it to. Running pods are unaffected; the API is briefly unavailable.
- name: Install k3s server
  hosts: k3s_server
  become: true
  tags: [k3s]
  tasks:
    - name: Check installed k3s version
      ansible.builtin.command: k3s --version
      register: k3s_current
      failed_when: false
      changed_when: false

    - name: Decide whether to install or upgrade
      ansible.builtin.set_fact:
        k3s_server_needs_install: "{{ k3s_current.rc != 0 or k3s_version not in k3s_current.stdout }}"

    # Written before the first start so k3s comes up with etcd and Secrets
    # encryption from day one.
    - name: Create k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create k3s audit log directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/server/logs
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Referenced from config.yaml, so they must exist before k3s (re)starts.
    - name: Write API audit policy and Pod Security defaults
      ansible.builtin.template:
        src: "templates/{{ item.src }}"
        dest: "/var/lib/rancher/k3s/server/{{ item.dest }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - { src: k3s_audit_policy.yaml.j2, dest: audit-policy.yaml }
        - { src: k3s_pod_security.yaml.j2, dest: pod-security.yaml }
      notify: Restart k3s

    - name: Write k3s server config
      ansible.builtin.template:
        src: templates/k3s_server_config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Restart k3s

    # The k3s version is pinned by INSTALL_K3S_VERSION, not by the script.
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/share/k3s-install.sh
        mode: "0700"
        force: true
      when: k3s_server_needs_install

    - name: Install or upgrade k3s server to {{ k3s_version }}
      ansible.builtin.command: /usr/local/share/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: k3s_server_needs_install
      changed_when: true

    - name: Wait for node token
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
      no_log: true  # cluster join secret

  handlers:
    # On first install the install script has already started k3s with this config.
    - name: Restart k3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
      when: k3s_current.rc == 0

# One agent at a time; on upgrade each is drained first.
- name: Install k3s agents
  hosts: k3s_agents
  become: true
  serial: 1
  tags: [k3s]
  vars:
    k3s_server_host: "{{ groups['k3s_server'][0] }}"
  tasks:
    - name: Check installed k3s version
      ansible.builtin.command: k3s --version
      register: k3s_agent_current
      failed_when: false
      changed_when: false

    - name: Decide whether to install or upgrade
      ansible.builtin.set_fact:
        k3s_agent_upgrading: "{{ k3s_agent_current.rc == 0 and k3s_version not in k3s_agent_current.stdout }}"

    - name: Drain agent
      ansible.builtin.command: >
        k3s kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets --delete-emptydir-data --timeout=300s
      delegate_to: "{{ k3s_server_host }}"
      when: k3s_agent_upgrading
      changed_when: true

    - name: Create k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write k3s agent config
      ansible.builtin.template:
        src: templates/k3s_agent_config.yaml.j2
        dest: /etc/rancher/k3s/config.yaml
        owner: root
        group: root
        mode: "0600"
      notify: Restart k3s-agent

    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/share/k3s-install.sh
        mode: "0700"
        force: true
      when: k3s_agent_current.rc != 0 or k3s_agent_upgrading

    - name: Install or upgrade k3s agent to {{ k3s_version }}
      ansible.builtin.command: /usr/local/share/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        K3S_URL: "https://{{ hostvars[k3s_server_host].ansible_host }}:6443"
        K3S_TOKEN: "{{ hostvars[k3s_server_host].node_token.content | b64decode | trim }}"
      when: k3s_agent_current.rc != 0 or k3s_agent_upgrading
      changed_when: true
      no_log: true  # K3S_TOKEN is the cluster join secret

    - name: Wait for agent to be Ready on the new version
      ansible.builtin.command: k3s kubectl get node {{ inventory_hostname }} --no-headers
      register: agent_after_upgrade
      until: "' Ready' in agent_after_upgrade.stdout and k3s_version in agent_after_upgrade.stdout"
      retries: 30
      delay: 10
      changed_when: false
      delegate_to: "{{ k3s_server_host }}"
      when: k3s_agent_upgrading

    - name: Uncordon agent
      ansible.builtin.command: k3s kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ k3s_server_host }}"
      when: k3s_agent_upgrading
      changed_when: true

  handlers:
    # Restarting the agent restarts the kubelet, not the pods. On first install the
    # install script has already started it with this config.
    - name: Restart k3s-agent
      ansible.builtin.systemd:
        name: k3s-agent
        state: restarted
      when: k3s_agent_current.rc == 0

- name: Verify cluster
  hosts: k3s_server
  become: true
  tags: [k3s, verify]
  vars:
    kubeconfig_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/homelab.yaml"
  tasks:
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: nodes
      until: >-
        nodes.stdout_lines
        | select('search', ' Ready ')
        | list | length == groups['k3s_cluster'] | length
      retries: 30
      delay: 10
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ nodes.stdout_lines }}"

    # k3s.yaml is root-only and points at 127.0.0.1. Read it with become and save a
    # copy pointing at node1, in its own file so an existing ~/.kube/config is untouched.
    - name: Read admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig
      no_log: true  # contains the cluster-admin key
      tags: [kubeconfig]

    - name: Create ~/.kube on this workstation
      ansible.builtin.file:
        path: "{{ kubeconfig_path | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      tags: [kubeconfig]

    - name: Save kubeconfig to this workstation
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:', 'https://' ~ ansible_host ~ ':') }}"
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true  # contains the cluster-admin key
      tags: [kubeconfig]

# On demand only ("never"): ansible-playbook site.yml --tags audit
# Lynis audits each node's hardening; debsecan lists installed packages with known
# vulnerabilities that already have a fix. Reports are saved to this workstation,
# and the counts go to node-exporter's textfile collector for Grafana.
- name: Security audit
  hosts: k3s_cluster
  become: true
  tags: [audit, never]
  vars:
    audit_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/homelab-audit/{{ now(fmt='%Y-%m-%d') }}"
    # Must match --collector.textfile.directory in k8s-homelab's monitoring/values.yaml.
    textfile_dir: /var/lib/node_exporter/textfile_collector
    lynis_score: >-
      {{ (lynis_summary.stdout_lines | select('match', '^hardening_index=') | first
          | default('hardening_index=NaN')).split('=')[1] }}
    lynis_warnings: "{{ lynis_summary.stdout_lines | select('match', '^warning') | list | length }}"
    lynis_suggestions: "{{ lynis_summary.stdout_lines | select('match', '^suggestion') | list | length }}"
    fixable_cves: "{{ debsecan.stdout_lines | length }}"
  tasks:
    - name: Install Lynis and debsecan
      ansible.builtin.apt:
        name:
          - lynis
          - debsecan
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Run Lynis
      ansible.builtin.command: lynis audit system --quick --no-colors
      register: lynis
      changed_when: false

    - name: Read the Lynis score, warnings and suggestions
      ansible.builtin.command: grep -E '^(hardening_index|warning\[\]|suggestion\[\])=' /var/log/lynis-report.dat
      register: lynis_summary
      changed_when: false
      failed_when: lynis_summary.rc > 1

    # Only CVEs with a fixed package available: the ones an upgrade resolves.
    - name: Run debsecan
      ansible.builtin.command: debsecan --suite {{ ansible_distribution_release }} --only-fixed
      register: debsecan
      changed_when: false

    - name: Create the node-exporter textfile directory
      ansible.builtin.file:
        path: "{{ textfile_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # node-exporter reads every *.prom file in the directory, so write under another
    # name and rename: it never sees a half-written file.
    - name: Write audit metrics for node-exporter
      ansible.builtin.copy:
        dest: "{{ textfile_dir }}/audit.prom.tmp"
        owner: root
        group: root
        mode: "0644"
        content: |
          # HELP lynis_hardening_index Lynis hardening index (0-100) from the last audit.
          # TYPE lynis_hardening_index gauge
          lynis_hardening_index {{ lynis_score }}
          # HELP lynis_warnings Lynis warnings from the last audit.
          # TYPE lynis_warnings gauge
          lynis_warnings {{ lynis_warnings }}
          # HELP lynis_suggestions Lynis suggestions from the last audit.
          # TYPE lynis_suggestions gauge
          lynis_suggestions {{ lynis_suggestions }}
          # HELP debsecan_fixable_vulnerabilities Installed package CVEs with a fix available in Debian.
          # TYPE debsecan_fixable_vulnerabilities gauge
          debsecan_fixable_vulnerabilities {{ fixable_cves }}
          # HELP homelab_audit_last_run_timestamp_seconds When the audit last ran on this node.
          # TYPE homelab_audit_last_run_timestamp_seconds gauge
          homelab_audit_last_run_timestamp_seconds {{ ansible_facts['date_time']['epoch'] }}

    - name: Publish audit metrics
      ansible.builtin.command: mv {{ textfile_dir }}/audit.prom.tmp {{ textfile_dir }}/audit.prom
      changed_when: true

    - name: Create the report folder on this workstation
      ansible.builtin.file:
        path: "{{ audit_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Save reports to this workstation
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: "{{ audit_dir }}/{{ inventory_hostname }}-{{ item.name }}.txt"
        mode: "0600"
      loop:
        - { name: lynis, content: "{{ lynis.stdout }}" }
        - { name: debsecan, content: "{{ debsecan.stdout or 'No installed packages have CVEs with a fix available.' }}" }
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false

    - name: Show summary
      ansible.builtin.debug:
        msg:
          - "Lynis hardening index: {{ lynis_score }}"
          - "Lynis warnings: {{ lynis_warnings }}, suggestions: {{ lynis_suggestions }}"
          - "Fixable CVEs: {{ fixable_cves }}"
          - "Reports: {{ audit_dir }}"
