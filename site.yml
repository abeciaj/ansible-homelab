---
# Homelab bootstrap playbook
# Run against: Dell OptiPlex 7070 Micro x3, Debian 13
#
# Usage:
#   ansible-playbook site.yml
#
# Covers:
#   1. Base update/upgrade + common tools
#   2. /etc/hosts static name resolution (homelab-scale "DNS")
#   3. SSH hardening, fail2ban, ufw, unattended security updates
#   4. k3s (server on node1, agents on node2/node3), pinned to k3s_version

# ---------------------------------------------------------------------------
# Play 1: runs on ALL nodes
# ---------------------------------------------------------------------------
- name: Base system setup (all nodes)
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Full upgrade
      ansible.builtin.apt:
        upgrade: dist

    - name: Install common tools
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - vim
          - git
          - htop
          - net-tools
          - openssh-server
          - ufw
          - fail2ban
          - unattended-upgrades
        state: present

    # Debian's default unattended-upgrades config only pulls from the
    # security archive and never reboots on its own, so nodes won't all
    # restart at once. Reboot them one at a time yourself when needed.
    - name: Enable daily unattended security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        owner: root
        group: root
        mode: "0644"

    # Key-only SSH, no root login, only the Ansible user. The 10- prefix
    # makes it load before other drop-ins, and sshd uses the first value it
    # sees. Validated with sshd -t so a bad config is never written.
    - name: Harden sshd
      ansible.builtin.template:
        src: templates/sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/10-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0
      changed_when: true

    - name: Remove swap entries from /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        line: '#\1'
        backrefs: true

    - name: Deploy /etc/hosts with all cluster nodes
      ansible.builtin.template:
        src: templates/hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"

    - name: Configure fail2ban jail for sshd
      ansible.builtin.template:
        src: templates/jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Ensure fail2ban is enabled and running
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

    - name: Allow SSH through ufw from the LAN only
      community.general.ufw:
        rule: allow
        name: OpenSSH
        src: "{{ ssh_allowed_cidr }}"

    # Older runs of this playbook allowed SSH from anywhere. Removed only
    # after the LAN rule above exists, so the current session isn't cut off.
    - name: Remove SSH-from-anywhere rule
      community.general.ufw:
        rule: allow
        name: OpenSSH
        delete: true

    # k3s needs these open between the nodes, otherwise agents can't join
    # and pod networking breaks. Must be in place before ufw is enabled.
    - name: Allow k3s node-to-node traffic from the LAN
      community.general.ufw:
        rule: allow
        src: "{{ lan_subnet }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
      loop:
        - { port: "6443", proto: tcp }    # Kubernetes API server
        - { port: "8472", proto: udp }    # Flannel VXLAN
        - { port: "10250", proto: tcp }   # Kubelet

    - name: Allow k3s pod and service networks
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
      loop:
        - "{{ k3s_pod_cidr }}"
        - "{{ k3s_service_cidr }}"

    - name: Enable ufw
      community.general.ufw:
        state: enabled
        policy: deny

  handlers:
    - name: Restart fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: restarted

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

# ---------------------------------------------------------------------------
# Play 2: k3s server (control-plane) — node1 only
# ---------------------------------------------------------------------------
- name: Install k3s server
  hosts: k3s_server
  become: true
  tasks:
    - name: Check installed k3s version
      ansible.builtin.command: k3s --version
      register: k3s_current
      failed_when: false
      changed_when: false

    # Runs on first install, and again whenever k3s_version is bumped
    # (re-running the install script is k3s's documented upgrade path).
    - name: Install or upgrade k3s server to {{ k3s_version }}
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION={{ k3s_version }}
        sh -
      when: k3s_current.rc != 0 or k3s_version not in k3s_current.stdout

    - name: Wait for node-token file to exist
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Store node token as a fact for agents to use
      ansible.builtin.set_fact:
        k3s_node_token: "{{ node_token_raw.content | b64decode | trim }}"

# ---------------------------------------------------------------------------
# Play 3: k3s agents (workers) — node2, node3
# ---------------------------------------------------------------------------
- name: Install k3s agents
  hosts: k3s_agents
  become: true
  vars:
    k3s_server_ip: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
    k3s_token: "{{ hostvars[groups['k3s_server'][0]].k3s_node_token }}"
  tasks:
    - name: Check installed k3s version
      ansible.builtin.command: k3s --version
      register: k3s_agent_current
      failed_when: false
      changed_when: false

    - name: Install or upgrade k3s agent to {{ k3s_version }}
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION={{ k3s_version }}
        K3S_URL=https://{{ k3s_server_ip }}:6443
        K3S_TOKEN={{ k3s_token }}
        sh -
      when: k3s_agent_current.rc != 0 or k3s_version not in k3s_agent_current.stdout
      # The command line contains the cluster join token; keep it out of output and logs.
      no_log: true

# ---------------------------------------------------------------------------
# Play 4: sanity check from the control-plane
# ---------------------------------------------------------------------------
- name: Verify cluster
  hosts: k3s_server
  become: true
  tasks:
    # Agents take a little while to register after install, so poll until
    # every node in the inventory reports Ready.
    - name: Wait for all nodes to be Ready
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: node_ready
      until: >-
        node_ready.stdout_lines
        | select('search', ' Ready ')
        | list | length == groups['k3s_cluster'] | length
      retries: 30
      delay: 10
      changed_when: false

    - name: Get node status
      ansible.builtin.command: k3s kubectl get nodes -o wide
      register: node_status
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        msg: "{{ node_status.stdout_lines }}"
