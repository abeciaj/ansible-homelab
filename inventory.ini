# Replace the IPs with your actual node addresses.
# ansible_host = the static IP you set on each Dell 7070 Micro.

[k3s_server]
node1 ansible_host=192.168.1.101

[k3s_agents]
node2 ansible_host=192.168.1.102
node3 ansible_host=192.168.1.103

# Convenience group containing all 3 nodes, used by the "common" play
[k3s_cluster:children]
k3s_server
k3s_agents
