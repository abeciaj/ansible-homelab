# Copy to inventory.ini (git-ignored) and fill in your values.

[k3s_server]
node1 ansible_host=192.168.1.101

[k3s_agents]
node2 ansible_host=192.168.1.102
node3 ansible_host=192.168.1.103

[k3s_cluster:children]
k3s_server
k3s_agents

[k3s_cluster:vars]
# SSH user with passwordless sudo. Becomes the only user allowed to log in over SSH.
ansible_user=YOUR_SSH_USER

# Subnet the nodes are on. SSH, k3s and HTTP(S) ports are only opened to this range.
lan_subnet=192.168.1.0/24

# Optional: allow SSH from a different range, e.g. a VPN. A wrong value locks you out.
# ssh_allowed_cidr=10.8.0.0/24

# See https://github.com/k3s-io/k3s/releases. Bump and re-run to upgrade.
k3s_version=v1.36.5+k3s1

# k3s defaults. Only change these if you change them in k3s too.
k3s_pod_cidr=10.42.0.0/16
k3s_service_cidr=10.43.0.0/16

# Ban for bantime seconds after maxretry failed logins within findtime seconds.
fail2ban_maxretry=5
fail2ban_bantime=3600
fail2ban_findtime=600
